  - id: AMD-03
    amends: corpus_identity_scope
    phase: RC2-016
    approved_by: chủ dự án (quyết định trực tiếp, 11/08/2026)
    decision: GIU_NGUYEN_SCOPE_VA_KHAI_RUI_RO
    finding: >
      `corpus_id` được băm trên 5.931 tệp trong cây `CORPUS.parent`, trong khi
      corpus thật chỉ có 1.973 tài liệu. `cmd_snapshot` quét thư mục cha chứ
      không lọc theo mẫu tên.
    why_it_matters: >
      `corpus_id` là hạt giống của TOÀN BỘ chuỗi định danh:
      document_uid = make_uid(corpus_id, rel) -> table_uid -> row_uid/column_uid
      -> observation_uid. Đổi scope = đổi định danh của mọi observation.
    decision_rationale: >
      Thu hẹp scope ở RC2 làm mọi UID của RC2 lệch khỏi RC1. Nhưng C1 no-loss
      và RC-16 differential đều so theo TẬP UID giữa RC1 và RC2 — thu hẹp bây
      giờ là tự bỏ mất khả năng đối chiếu, đúng vào lúc cần nó nhất. Giữ
      nguyên ở RC2, xét lại ở RC3 khi RC2 đã có baseline riêng.
    risk_accepted: >
      `corpus_id` nhạy cảm với tệp KHÔNG thuộc corpus nằm cùng cây. Thêm hoặc
      bớt một tệp rác trong data/external/vifinqa/ sẽ đổi `corpus_id`, đổi
      `build_id`, và làm C0 đỏ với lý do gây hiểu nhầm.
    mitigation:
      - "Runbook §5 bước 3 bắt buộc kiểm corpus_file_count = 1973 trước build B."
      - "OUTPUT của build PHẢI nằm ngoài data/external/ — nếu không, output của
         build A trở thành đầu vào của build B và C0 đỏ sai lý do."
      - "Manifest ghi cả corpus_id và số tệp đã băm để hậu kiểm."
    revisit_at: RC3
    open_issue: RC2-016

  - id: AMD-04
    amends: corpus_identity_scope
    supersedes: AMD-03
    phase: RC2-016
    approved_by: chủ dự án — sau khi phương án C được trình bày đầy đủ (11/08/2026)
    decision: TACH_uid_namespace_id_VA_corpus_content_hash
    supersede_reason: >
      AMD-03 (giữ nguyên scope) được duyệt KHI CHƯA có phương án C trên bàn.
      Sau khi đo lại, rủi ro của AMD-03 là hiện thực chứ không lý thuyết: cây
      data/external/vifinqa/ từng có 6.258 tệp ở một thời điểm và 5.931 ở thời
      điểm khác. Chỉ cần cache ghi thêm một .lock giữa build A và build B là
      corpus_id đổi -> build_id đổi -> C0 đỏ với lý do gây hiểu nhầm.
    design:
      uid_namespace_id: >
        Hạt giống DUY NHẤT của make_uid(). ĐÓNG BĂNG bằng corpus_id của RC1
        (sha256:ca033190...). Nhờ vậy document_uid/table_uid/row_uid/column_uid/
        observation_uid của RC2 TRÙNG RC1, và C1 no-loss + RC-16 differential
        vẫn so được theo TẬP UID.
      corpus_content_hash: >
        Băm CHỈ tệp thuộc corpus thật (financial_statements/**/*_extracted.txt).
        Đi vào build_id/manifest/differential. Miễn nhiễm với .cache và tệp rác.
    rejected_alternatives:
      - id: A
        what: giữ nguyên scope 5.931 tệp (AMD-03)
        why_rejected: corpus_id vẫn phụ thuộc cây đang sống -> build_id không ổn định
      - id: B
        what: thu hẹp corpus_id về đúng 1.973 tệp
        why_rejected: >
          đổi mọi UID của RC2 -> mất mốc so với RC1, đúng lúc C1 và RC-16 cần nó nhất
    implemented_by:
      - src/data_pipeline/manifest.py (RC1_UID_NAMESPACE_ID, is_corpus_report, build_manifest)
      - src/data_pipeline/cli.py (_uid_namespace_from_config, cmd_snapshot)
      - configs/vifinqa_silver_v1.yaml (corpus.uid_namespace_id)
    tests: tests/test_rc2_016_uid_namespace.py
    revisit_at: RC3 (chỉ khi cần migration namespace, kèm mapping UID cũ -> mới)
    open_issue: RC2-016

# ═══════════ Rule đã NGHỈ HƯU — kèm bằng chứng, không xoá âm thầm ═══════════
# Một rule bị bỏ mà không để lại gì thì lần sau không ai biết vì sao nó biến
# mất, và người ta sẽ cài lại nó. Mỗi mục ở đây phải có `proof_assertions`
# CHẠY ĐƯỢC trên RC2: nếu giả định "đã bị thâu tóm" sai, test đỏ ngay.
retired_rules:
  - flag: value_unit_period_conflict
    status: RETIRED_AS_SUBSUMED
    retired_at: RC-02
    evidence_doc: to_read/32_DECISION_value_unit_period_conflict.md
    finding: >
      Cờ ghép ba trục. Tách ra đo riêng trên RC1 thì cả ba đều đã có người bắt,
      phần dư bằng 0. Cài rule như khai sẽ đổi trạng thái đúng 0 observation.
    subsumed_by:
      - axis: period
        by: STRUCTURALLY_IMPOSSIBLE
        measured: 0
        note: >
          `observations.period_*` được SAO từ `columns.period_*` khi dựng. Hai
          "tầng bằng chứng" thực ra là MỘT tầng, nên không thể nói ngược nhau.
          Không phải "chưa xảy ra" mà là không thể xảy ra.
      - axis: scale
        by: scale_rejected_implausible
        measured: 1996
        overlap: 1996        # giao 100%
        note: cài thêm nghĩa là hai tên gọi cho cùng một tập → RC-16 phải giải thích lý do trùng
      - axis: unit
        by: confidence_low
        measured: 55181
        overlap: 55181       # giao 100%
        note: >
          Và chúng KHÔNG phải lỗi: percent-trong-cột-money 39.808,
          shares-trong-cột-money 12.422 — tinh chỉnh cấp dòng hợp lệ của báo
          cáo tài chính. Dòng đúng, cột không sai.
    proof_assertions:
      - id: RET-01
        axis: period
        assert: "COUNT(o.period_end <> k.period_end) = 0"
        sql_scope: observations o JOIN columns k USING (table_uid, grid_col_idx)
      - id: RET-02
        axis: scale
        assert: "COUNT(o.scale_exponent <> k.scale_exponent AND r.execution_ready = 1) = 0"
      - id: RET-03
        axis: unit
        assert: "COUNT(o.unit_kind <> k.unit_kind AND r.execution_ready = 1) = 0"
    why_stronger_than_keeping: >
      Giữ nguyên: cờ chặn 0 ca và KHÔNG AI BIẾT — cảm giác có lớp bảo vệ mà
      thực tế không có. Sau khi nghỉ hưu kèm RET-01..03: nếu RC2 sinh ra dù chỉ
      MỘT ca lệch mà vẫn ready, test đỏ ngay. Lớp bảo vệ bây giờ mới có thật.

# ═══════════ RC-09 mở rộng — kiểm HAI CHIỀU ═════════════════════════════════
# Lý do `value_unit_period_conflict` sống sót được ba pha: không có gì kiểm
# chiều ngược. RC-09 chỉ hỏi "rule đang chạy có được map không". Chiều còn lại
# — "rule được map có thật sự chạy không" — không ai hỏi.
