# RC2 · HỢP ĐỒNG ĐÓNG BĂNG Ở P3 — khoá TRƯỚC khi implement RC-02…RC-10
#
# Vì sao tệp này tồn tại: review 28 §5 chỉ ra map v2 đặt policy work SAU build.
# Hệ quả là candidate A/B thiếu remediation và phải build lại. Tệp này khoá
# semantics để P4 chỉ còn là thi công, không phải quyết định lại.
#
# ĐÂY LÀ DỮ LIỆU, KHÔNG PHẢI MÃ. Sửa tệp này = sửa hợp đồng, phải bump version.

contract_version: "1.0"
frozen_at_phase: P3
frozen_against_baseline: b927c3e8f90aed74
supersedes: []

# ═══════════════════════ C4 · governance / safety gate ═══════════════════════
# Plan 17 §1.4 và §RC-20 đòi C4 PASS nhưng không định nghĩa. Review 28 §RC-20
# chốt định nghĩa; đây là bản khoá, machine-checkable, đo TRÊN RC2.
c4_gate:
  description: >
    Không một fact nào vừa được phép tính tự động vừa mang rủi ro đã biết.
  # Mọi biểu thức dưới đây phải cho ra 0. Tên trường map vào bảng
  # `observation_readiness` (RC-02) và `observations` (schema hiện có).
  invariants:
    - id: C4-01
      assert: "COUNT(execution_ready=1 AND execution_candidate=0) = 0"
      rationale: ready ⇒ candidate. Một fact không đủ field mà vẫn ready là mâu thuẫn.
    - id: C4-02
      assert: "COUNT(execution_ready=1 AND confidence='low') = 0"
      rc1_baseline: 181160
    - id: C4-03
      assert: "COUNT(execution_ready=1 AND blocking_reasons_json <> '[]') = 0"
    - id: C4-04
      assert: "COUNT(execution_ready=1 AND collision_class IS NOT NULL) = 0"
      note: gồm cả unknown và mọi lớp đã phân loại — §A.6 cấm fact mơ hồ vào ready.
    - id: C4-05
      assert: "COUNT(execution_ready=1 AND flag 'tiny_money_unresolved') = 0"
    - id: C4-06
      assert: "COUNT(execution_ready=0 AND blocking_reasons_json='[]' AND execution_candidate=1) = 0"
      rationale: mọi not-ready phải nói được LÝ DO, nếu không thì không audit được.
    - id: C4-07
      assert: "COUNT(active risk code NOT IN defect_taxonomy.reverse_index) = 0"
    - id: C4-08
      assert: "COUNT(observation_readiness.policy_version <> <current>) = 0"
    - id: C4-09
      assert: "COUNT(known ambiguous fact IN execution_ready) = 0"
      note: hợp của C4-04 và C4-05; giữ riêng vì Plan 17 §1.4 nêu đích danh.
    - id: C4-10
      assert: "COUNT(observations WHERE value_kind='money' AND unit_kind NOT IN (money, unknown, NULL)) = 0"
      note: >
        RC2-036 · bất biến NỘI TẠI, thêm sau khi differential bắt được 20.378
        bản ghi tự mâu thuẫn trên bản dựng 4c86c9e43915694a: ô mang TIỀN nhưng
        `unit_kind` là `rate`/`shares`/`days`/`count`. Nguyên nhân:
        `classify_value_kind` có cổng hình dạng `_shape_allows`, còn
        `unit_resolver._find_kind` thì không — nên một TỪ KHOÁ trong nhãn cột
        lật được đơn vị mà không lật được loại giá trị.
        `unknown`/NULL KHÔNG vi phạm: "chưa xác định" là trạng thái trung thực;
        chỉ một loại đơn vị KHÁC mới là mâu thuẫn.
        Cổng G4 có đo tỷ lệ này nhưng ngưỡng 93% không phân biệt được "chưa
        biết" với "biết sai" — RC2 đạt 93,41% và vẫn PASS trong khi RC1 đạt
        94,11%. Một tỷ lệ có ngưỡng không thay được một bất biến ngưỡng 0.

# ═══════════════════ Precedence — KHÔNG để thứ tự code quyết ═════════════════
# Review 28 §RC-02: "precedence giữa blocking và warning phải cố định".
policy_precedence:
  order: [NON_CANDIDATE, BLOCKING, WARNING, PASS]
  rules:
    - Một observation thiếu field bắt buộc là NON_CANDIDATE; không xét blocking nữa.
    - NON_CANDIDATE ⇒ execution_candidate=0 ⇒ execution_ready=0.
    - Có ≥1 blocking reason ⇒ execution_ready=0, kể cả khi là candidate.
    - Warning KHÔNG hạ execution_ready, nhưng BẮT BUỘC xuất hiện ở warning_reasons_json.
    - blocking_reasons_json và warning_reasons_json là JSON canonical (mảng chuỗi
      đã sort, không trùng). Cấm kiểm bằng LIKE trên chuỗi tự do.

# ═════════════ C4 · hai cờ đánh giá THEO BẰNG CHỨNG, không theo nhãn ═════════
# Không ai phải chọn blocking/warning cho cả 377.406 hay 94.071 ca.
conditional_flag_policy:
  period_from_table:
    rc1_in_ready: 377406
    warning_if_all:
      - "period_end IS NOT NULL"
      - "period_source IS NOT NULL AND period_source <> 'none'"
      - "confidence IN ('high','medium')"
      - "không có value_unit_period_conflict"
    blocking_otherwise: true
  generic_row_label:
    rc1_in_ready: 94071
    warning_if_all:
      - "collision_class IS NULL"
      - "row_path_text <> '' AND row_path_text <> metric_label_clean"
      - "row_path đủ phân biệt trong phạm vi (table_uid, column_uid)"
    blocking_otherwise: true

# ═══════════════════════ RC-15 · no-loss bằng TẬP UID ════════════════════════
# CẤM: observations + dropped = source_cells. Hai tập có semantic khác nhau —
# 6.212.883 là MỌI ô, 3.413.207 là tập digit-bearing đã xử lý.
no_loss_contract:
  sets:
    U_source:      "mọi source_cell_uid trong source_cells"
    U_digit:       "source cell thoả digit_bearing rule (có version)"
    U_observation: "DISTINCT source_cell_uid trong observations"
    U_dropped:     "DISTINCT source_cell_uid trong dropped_cells"
  invariants:
    - "U_observation ∩ U_dropped = ∅"
    - "U_digit = U_observation ∪ U_dropped"
    - "U_digit − (U_observation ∪ U_dropped) = ∅"
    - "duplicate source_cell_uid trong observations = 0"
    - "duplicate source_cell_uid trong dropped_cells = 0"
  digit_bearing_rule:
    name: has_decimal_digit
    version: "1.0"
    # Nguồn sự thật là `observation_builder._HAS_DIGIT`, dùng cho `_drop()`.
    definition: "re.search(r'\\d', text_clean) — ô có ít nhất một chữ số thập phân"
    note: >
      Ô CHỮ THUẦN không bao giờ là ứng viên số liệu, nên không vào U_digit và
      cũng không vào dropped_cells. Đó là lý do U_digit ≪ U_source.
  report_must_contain: [row_count, distinct_uid_count, digit_bearing_rule_version]
  eligible_financial_source_cells:
    status: "CHƯA ĐỊNH NGHĨA"
    action: "Nếu RC-15 cần trường này thì định nghĩa RIÊNG, KHÔNG trộn vào U_digit."
  rc1_locally_verified:
    observations_rows: 2646976
    observations_distinct_source_cell_uid: 2646976
    observations_null_source_cell_uid: 0
    dropped_rows: 766231
    dropped_distinct_source_cell_uid: 766231
    dropped_null_source_cell_uid: 0
    overlap: 0
    source_cells_build_db: 6212883
    note: "source_cells KHÔNG có trong release slim — C1 của RC2 phải chạy trên build DB RC2."

# ═══════════════════════ RC-07 · hợp đồng sửa mojibake ═══════════════════════
# Bỏ chiến lược "sửa từng đoạn mã hoá được" — nó có thể phá tiếng Việt đúng
# lân cận. Chỉ sửa trong CỬA SỔ ỨNG VIÊN và chỉ khi validate đạt.
mojibake_contract:
  pipeline: [preserve_raw, detect_candidate_window, attempt_repair, validate, accept_or_reject, audit_trace]
  accept_only_if_all:
    - "round-trip sloppy-CP1252 → UTF-8 hợp lệ"
    - "mojibake score GIẢM THẬT SỰ"
    - "NFC/Unicode validity không giảm"
    - "vùng tiếng Việt đúng lân cận KHÔNG đổi một ký tự nào"
  must_not:
    - "quét mù toàn chuỗi"
    - "sửa token ASCII/Latin hợp lệ"
    - "thay đổi text_source (DI-04)"
  acceptance:
    mojibake_regression: 0
    false_positive: 0
    nfc_violation: 0
    control_character_violation: 0
  fixture_categories:
    - id: MJ-01
      name: ca thật RC1
      input: "7 J1001 C TRÁC HÃ¹ Tổng Công ty Viglacera - CTCP Địa chỉ: Tò"
      damaged_window: "HÃ¹"
      expected_window_repair: "Hù"
      note: >
        Bản C07 hiện tại TRẢ NGUYÊN VĂN cho ca này. Root cause: `_sloppy_encode`
        đòi TOÀN BỘ chuỗi mã hoá được, mà `ổ` (U+1ED5) nằm ngoài Latin-1.
        Đây là ca chặn của RC-07.
    - id: MJ-02
      name: hỗn hợp tiếng Việt đúng + mojibake
      requirement: "phần đúng phải không đổi một ký tự"
    - id: MJ-03
      name: ASCII/Latin hợp lệ  (Résumé · naïve · Ø 12mm · ©2024 ABC)
      expected: không đụng
    - id: MJ-04
      name: dấu câu Unicode  (« » · ± · °)
      expected: không đụng
    - id: MJ-05
      name: tiếng Việt đã đúng
      expected: không đụng
  rc1_baseline: {DQ-ENC-MOJIBAKE: 1}

# ═════════════════════ RC-08 · hợp đồng readiness cấp bảng ═══════════════════
# Review 28 §RC-08: map v2 SAI khi đòi retrieval_ready phải giảm.
table_readiness_contract:
  fields: [retrieval_ready, has_observations, execution_candidate_obs,
           execution_ready_obs, has_execution_candidate, has_execution_ready,
           review_required_obs, not_ready_reason_counts_json]
  semantics:
    retrieval_ready: "có locator + có nội dung tìm được. ĐỘC LẬP với execution."
    has_observations: "n_observations > 0"
    has_execution_ready: "execution_ready_obs > 0"
  invariants:
    - "table_cards 1:1 với tables"
    - "SUM(execution_ready_obs) = COUNT(observation_readiness.execution_ready=1)"
    - "n_observations = 0 ⇒ execution_ready_obs = 0"
    - "locator IS NOT NULL AND evidence_ref IS NOT NULL"
  explicitly_allowed:
    - "retrieval_ready = 146.246/146.246 VẪN HỢP LỆ nếu mỗi bảng thoả policy."
  must_end: "consumer không phân biệt được retrieval readiness với execution readiness"
  rc1_baseline: {retrieval_ready: 146246, zero_observation_tables: 12353, zero_ready_tables: 27144}

# ═══════════════════════ RC-10 · hợp đồng manifest ═══════════════════════════
manifest_contract:
  build_id:
    deterministic_inputs: [source_hash, config_hash, corpus_hash, component_versions, schema_version, counts]
    must_not_depend_on: [timestamp, absolute_path, random_uuid, hostname, username]
    config_hash_scope: "configs/*.yaml (SỐ NHIỀU) — đã vá; RC1 băm nhầm config/ (số ít)"
  nondeterministic_fields_excluded_from_canonical_comparison:
    - created_at
    - checksum_seconds
    - "*.seconds"
    - logs/*
  required_keys: [release_label, acceptance_status, build_id, source_commit, source_hash,
                  corpus_hash, config_hash, schema_version, component_versions,
                  readiness_policy_version, defect_taxonomy_version, created_at,
                  counts, gate_summary, blocking_failures, allowed_blocked_gates, files]
  rc1_missing_keys: [acceptance_status, source_commit, source_hash, config_hash,
                     readiness_policy_version, defect_taxonomy_version, allowed_blocked_gates]
  allowed_blocked_gates: [SG, C2, C3]
  acceptance_status_rule: "chỉ ghi rc_ready SAU KHI gate thật sự pass"
  generation_order: [final_db, exports, reports, docs, counts, manifest, SHA256SUMS, package, verify]
  checksum_scope: "SHA256SUMS chứa MỌI tệp trong release TRỪ chính SHA256SUMS — tránh vòng lặp."

