# ═══════════ SỬA ĐỔI HỢP ĐỒNG · RC-02 ═══════════════════════════════════════
# Hợp đồng đóng băng ở P3 KHÔNG phải là bất khả xâm phạm — nó là thứ không được
# sửa TRONG IM LẶNG. Mỗi sửa đổi phải nói: sửa mục nào, vì sao, bằng chứng đâu,
# giá bao nhiêu, ai duyệt. Bản ghi dưới đây là hình mẫu cho mọi sửa đổi sau.
amendments:
  - id: AMD-A5-01
    amends: readiness_policy.confidence.low_if_conditions
    phase: A5
    approved_by: chủ dự án (yêu cầu trực tiếp — "data phải tốt nhất có thể")
    evidence_doc: docs/62_A5_PLAN.md
    finding: >
      Tập execution_ready của A4 CHỈ chứa ô tiền. 103.193 ô percentage, 22.016
      share_count, 73 interest_rate, 9 days đều là candidate mà 0 ô ready. Đo
      được nguyên nhân duy nhất: 100,00% trong số đó có confidence='low' vì
      đúng một vế `scale_source IN ('assumed','none')`, không có nguyên nhân
      thứ hai. Vế đó là proxy của bậc nhân TIỀN; với percent/shares/days thì
      không có bậc nhân nào để biết, nên `none` là trạng thái ĐÚNG chứ không
      phải bằng chứng còn thiếu.
    change: >
      Thu hẹp vế đó còn `AND unit_kind NOT IN ('percent','shares','days')`.
      Viết dạng NOT IN để unit kind mới thêm sau mặc định RƠI VÀO diện phải có
      bằng chứng — fail closed. Kèm cờ chặn percent_value_implausible
      (|v| >= 1.000) vì nếu không thì 445 ô tiền bị gán nhầm % sẽ vào ready.
    new_reason_class: null
    new_quality_flag: percent_value_implausible
    scope: >
      Guard cho TIỀN không đổi một chữ: 1.654 ô money có scale_source='none'
      vẫn low, vẫn bị chặn. `rate` CỐ Ý không được miễn.
    measured_on_a4:
      simulation_fidelity_confidence: "mismatch 0/2.633.554 = 100,00%"
      control_ready_on_cohort: "stored 0 = simA 0"
      ready_before: 1673840
      ready_after_predicted: 1795684
      delta: 121844
      by_kind: "percentage 101.189 · share_count 20.646 · days 9 · money 0 (không đổi)"
      guard_flag_cells: 696
      guard_blocks_candidates: 445
      rejected_alternative: >
        Bỏ hẳn vế scale khỏi low_if_conditions: chạm cả 1.654 ô money
        scale_source='none' — sai đúng loại lỗi mà luật này sinh ra để chặn.
        Mở `rate`: 3/73 ca đọc tay cho Tiền gửi khách hàng ra 545 · 580 · 780,
        lãi suất 545% không thể; nguyên nhân chưa xác định nên không mở.
        Đặt trần percent ở 100 thay vì 1.000: loại thêm 22.299 ô mà phần lớn
        là tỷ lệ sở hữu 100% và nợ/vốn > 100% hợp lệ.
    residual: >
      2 ô percentage ở dải [1e3,1e4) có thể là tỷ lệ thật bị cờ chặn. Chúng
      KHÔNG mất dữ liệu — vẫn là candidate, chỉ không tự động tính.

