  direction_a:
    id: RC09-A
    assert: "COUNT(active_rule_code NOT IN policy_mapping) = 0"
    status: đã khai ở active_rule_inventory.acceptance
  direction_b:
    id: RC09-B
    assert: "COUNT(policy_flag NOT IN code_emitted_flags) = 0"
    exempt: retired_rules[].flag
    status: ĐÃ CÀI ở RC-04
    implemented_by: tests/test_rc04_rule_inventory.py::test_B_moi_rule_TRONG_SO_deu_duoc_code_phat_ra
    registry: configs/rule_inventory_v1.yaml
    scope_note: >
      Sổ khoá theo MÃ (26 rule quality.py phát ra), không theo mẫu RC1 (14 rule
      đã nổ). 12 rule nổ 0 lần trên RC1 vẫn phải có defect + consequence, nếu
      không thì lần đầu chúng nổ trên RC2 sẽ là `unmapped_active_rule`.
    rationale: >
      Với vế B, mọi cờ khai trong policy mà không dòng mã nào phát ra sẽ làm đỏ
