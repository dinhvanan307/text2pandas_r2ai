# RC-04 · SỔ ĐĂNG KÝ RULE — khoá theo MÃ, không theo mẫu RC1.
#
# Hợp đồng P3 `active_rule_inventory` liệt kê **14** rule. Đó là 14 rule đã NỔ
# trên corpus RC1 — một mẫu, không phải bộ luật. `quality.py` phát ra **26**.
# 12 rule còn lại nổ 0 lần trên RC1 và vì thế không có mặt trong inventory; nếu
# một trong số đó nổ trên RC2, nó sẽ là **rule không có defect, không có
# consequence, không ai kiểm** — đúng định nghĩa `unmapped_active_rule`.
#
# Vì vậy sổ này khoá theo thứ mã CÓ THỂ phát ra, không theo thứ dữ liệu tình cờ
# làm nó phát ra. Đây cũng là vế A của RC-09.
#
# `consequence` dùng đúng từ vựng của `readiness_policy_v1.yaml`:
#   non_candidate         thiếu field bắt buộc → không tính được
#   blocking              tính được nhưng chưa đủ an toàn
#   warning_conditional   warning HAY blocking tuỳ bằng chứng (conditional_flags)
#   warning               vẫn ready, nhưng người tiêu thụ phải biết hệ quả
#   build_failure         không được phép tồn tại trong một build đạt
#   informational         ghi nhận trạng thái hợp lệ, không hạ readiness

inventory_version: "1.0"
source_of_truth: src/data_pipeline/quality.py
supersedes_scope: >
  Mở rộng `active_rule_inventory` của rc2_contracts_v1.yaml từ 14 rule đã nổ
  trên RC1 lên toàn bộ 26 rule mà mã có thể phát ra.

acceptance:
  - "mọi mã `Q-*` trong quality.py phải có mặt ở đây (RC-09 vế A)"
  - "mọi mã ở đây phải tồn tại trong quality.py, trừ `retired` (RC-09 vế B)"
  - "mọi rule `blocking` / `non_candidate` phải có ≥1 test dương và ≥1 test âm"
  - "mọi rule `warning` phải ghi `downstream` — hệ quả với người tiêu thụ"

