# Tên THƯƠNG MẠI — lớp bổ sung, curated bằng tay.
#
# VÌ SAO TÁCH FILE RIÊNG
# `company_alias_v1.yaml` sinh tự động từ `code_stock.csv` và header của nó ghi
# rõ "KHÔNG sửa tay". Tên thương mại thì KHÔNG suy ra được từ tên pháp lý
# ("Tổng công ty Phân bón và Hóa chất Dầu khí - CTCP" → "Đạm Phú Mỹ"), nên nó
# phải là một lớp riêng, có người chịu trách nhiệm, và phải qua hồi quy đo được.
#
# LUẬT NHẬN MỘT BÍ DANH
#   1. dạng nén phải dài ≥ 5 ký tự — ngắn hơn quá dễ khớp nhầm trong câu;
#   2. không được là chuỗi con của bí danh mã khác (kiểm bằng
#      `src/retrieval/check_brand.py`, chạy trong test);
#   3. thêm vào KHÔNG được làm tụt candidate recall trên 1.012 câu.
#
# Bí danh cố ý KHÔNG thêm, ghi lại để lần sau không ai thêm lại:
#   "Masan"     → MSN/MCH/MML/MSR cùng khớp, câu hỏi không tự phân biệt được
#   "Vinhomes"  → không có mã trong corpus 100 mã
#   "Sài Gòn"   → SGB/SCR/SAB/SHB cùng chứa
#   "Điện lực"  → DTK/POW/EVF/GEE cùng chứa
